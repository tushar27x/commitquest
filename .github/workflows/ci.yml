# CI for every PR and push to main. The tests use no secrets: the backend runs against Testcontainers
# (Postgres + Redis in Docker, never Neon), and the web tests use fixtures. The last job builds the
# backend's Docker image on every run and pushes it to Docker Hub only on a push to main, once every
# other job is green: the only step with secrets (docs/deploy.md). The web app deploys on Vercel.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (./mvnw verify)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Unit tests (Surefire), then the *IT classes on Testcontainers (Failsafe).
      - run: ./mvnw -B verify

  web:
    name: Web (lint, test, build, wiring)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Before build: `prebuild` regenerates the design files and would hide drift from docs/design/.
      - run: npm run design:check
      - run: npm run lint
      # Includes lib/api/fixtures.test.ts: fixture drift from docs/api/fixtures/ and validation against the types.
      - run: npm test
      - run: npm run build
      # I4: the /api rewrite forwards path, query, headers and bodies intact, and waits for a slow /sync
      # (35 s, past Next's 30 s default proxy timeout). Starts a fake backend and `next dev`; about a minute.
      - name: Wiring check (proxy)
        run: node ../e2e/wiring/proxy-check.mjs

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      # The full-stack project starts the backend (it/E2eBackend) on Testcontainers: Java, Maven and Docker.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      # Mock mode on its own production build: every screen, mood, tier and the GET errors.
      - run: npm run test:mock
      # The real build: the stubbed project (hand-off, every error state) and the full-stack smoke test.
      # Nothing reaches GitHub, Groq or Neon: GitHub is stubbed in the backend, the LLM port is closed.
      - run: npm run test:web
        env:
          E2E_FULLSTACK: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  image:
    name: Docker image (backend)
    needs: [backend, web, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'insightshub-backend' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # The tests ran in the backend job on the same commit; this only packages the jar the Dockerfile copies.
      - run: ./mvnw -B -q -DskipTests package
      - id: tag
        run: echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # The EC2 t3.micro is x86_64. On PRs the image is only built, to catch a broken Dockerfile.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.tag.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - if: env.PUSH == 'true'
        run: echo "Pushed $IMAGE:latest and $IMAGE:${{ steps.tag.outputs.sha }}; on EC2 run /opt/insightshub/deploy.sh" >> "$GITHUB_STEP_SUMMARY"
