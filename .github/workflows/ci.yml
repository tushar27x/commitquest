# CI for every PR and push to main: backend `./mvnw verify` and the web checks. The Playwright e2e suites
# (e2e/) are not run here; run them locally (AGENTS.md). The tests use no secrets: the backend runs against
# Testcontainers (Postgres + Redis in Docker, never Neon), and the web tests use fixtures. On a pull request,
# `image-check` builds the backend's Docker image and pushes nothing. Only on a push to main (a merged
# PR), `image-publish` pushes it to Docker Hub once every other job is green: the only job with
# secrets (docs/deploy.md). The web app deploys on Vercel.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (./mvnw verify)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Unit tests (Surefire), then the *IT classes on Testcontainers (Failsafe).
      - run: ./mvnw -B verify

  web:
    name: Web (lint, test, build, wiring)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Before build: `prebuild` regenerates the design files and would hide drift from docs/design/.
      - run: npm run design:check
      - run: npm run lint
      # Includes lib/api/fixtures.test.ts: fixture drift from docs/api/fixtures/ and validation against the types.
      - run: npm test
      - run: npm run build
      # I4: the /api rewrite forwards path, query, headers and bodies intact, and waits for a slow /sync
      # (35 s, past Next's 30 s default proxy timeout). Starts a fake backend and `next dev`; about a minute.
      - name: Wiring check (proxy)
        run: node ../e2e/wiring/proxy-check.mjs

  # Pull requests: build the backend image to catch a broken Dockerfile. Never logs in, never pushes,
  # and doesn't reference the Docker Hub secrets.
  image-check:
    name: Docker build check
    if: github.event_name == 'pull_request'
    needs: [backend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B -q -DskipTests package
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: commitquest-backend:pr-check
          cache-from: type=gha

  # A merge to main (a push to main): publish :latest and :sha-<7> once every other job is green.
  # The only job with secrets (docs/deploy.md). The EC2 instance then pulls it with deploy.sh.
  image-publish:
    name: Publish image (main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, web]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # <user>/commitquest-backend: a repository variable, or a secret (then it shows as *** in the logs).
      IMAGE: ${{ vars.DOCKERHUB_IMAGE || secrets.DOCKERHUB_IMAGE }}
    steps:
      - if: env.IMAGE == ''
        run: |
          echo "::error::DOCKERHUB_IMAGE is not set (Settings → Secrets and variables → Actions): nothing to push to"
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # The tests ran in the backend job on the same commit; this only packages the jar the Dockerfile copies.
      - run: ./mvnw -B -q -DskipTests package
      - id: tag
        run: echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # The EC2 t3.micro is x86_64.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.tag.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: echo "Pushed $IMAGE:latest and $IMAGE:${{ steps.tag.outputs.sha }}; on EC2 run /opt/commitquest/deploy.sh" >> "$GITHUB_STEP_SUMMARY"
