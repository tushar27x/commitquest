# Deploy the backend to the EC2 instance (docs/deploy.md). Manual: Actions → Deploy backend → Run
# workflow, from main once its CI is green. Builds the jar here (the t3.micro is too small to build),
# copies it over SSH, and runs /opt/insightshub/deploy.sh, which restarts and rolls back if unhealthy.
# The web app deploys itself on Vercel from main.
name: Deploy backend

on:
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy to EC2
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Tests ran in CI on the same commit; this only packages.
      - run: ./mvnw -B -q -DskipTests package

      - name: Name the jar after the commit
        id: jar
        run: |
          name="insightshub-${GITHUB_SHA::7}.jar"
          cp target/insightshub-*.jar "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: SSH setup
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copy and deploy
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          JAR: ${{ steps.jar.outputs.name }}
        run: |
          ssh_opts=(-i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -o BatchMode=yes)
          scp "${ssh_opts[@]}" "$JAR" "$EC2_USER@$EC2_HOST:/tmp/$JAR"
          ssh "${ssh_opts[@]}" "$EC2_USER@$EC2_HOST" "sudo /opt/insightshub/deploy.sh /tmp/$JAR"

      - name: Public health check
        env:
          API_URL: ${{ vars.API_URL }}
        if: env.API_URL != ''
        run: curl -sf --max-time 10 "$API_URL/actuator/health"

      - if: always()
        run: rm -f ~/.ssh/id_deploy
