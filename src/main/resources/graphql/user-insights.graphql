# Ported from v1 (server/app/services/github_service.py), extended for v2:
# - rateLimit: logged on every call to watch the 5,000 points/hour budget
# - commit oid / committedDate / author: needed to store commits and detect habits
# - contributionsCollection(from, to): lets scheduled syncs fetch a narrower window (max 1 year)
# - user id: the GraphQL node id, the branch scan's author filter
# - B11: the per-repo lists (maxRepositories: 100, GitHub's most) carry isPrivate. totalCommitContributions and its
#   siblings have no privacy filter, so when private access is off the totals are the sums of these lists with the
#   private entries dropped; the pull request nodes carry the repository's isPrivate for the same reason.
# - $privacy (B10): PUBLIC unless the user opted in to private repos AND the token has the repo scope. Left out,
#   the repositories connection lists private repos too whenever the token can see them. isPrivate marks them so
#   the engine can count them without ever naming them.
query UserInsights($login: String!, $from: DateTime!, $to: DateTime!, $privacy: RepositoryPrivacy) {
  rateLimit {
    cost
    remaining
    resetAt
  }
  user(login: $login) {
    id
    login
    name
    avatarUrl
    url
    bio
    followers {
      totalCount
    }
    following {
      totalCount
    }
    repositories(first: 5, privacy: $privacy, orderBy: {field: STARGAZERS, direction: DESC}) {
      nodes {
        name
        isPrivate
        stargazerCount
        languages(first: 3) {
          nodes {
            name
          }
        }
        defaultBranchRef {
          target {
            ... on Commit {
              history(first: 5) {
                nodes {
                  oid
                  message
                  committedDate
                  author {
                    user {
                      login
                    }
                  }
                }
              }
            }
          }
        }
        readme: object(expression: "HEAD:README.md") {
          ... on Blob {
            text
          }
        }
        tree: object(expression: "HEAD:") {
          ... on Tree {
            entries {
              name
              type
            }
          }
        }
      }
    }
    pullRequests(first: 10, orderBy: {field: CREATED_AT, direction: DESC}) {
      nodes {
        additions
        deletions
        title
        repository {
          isPrivate
        }
      }
    }
    contributionsCollection(from: $from, to: $to) {
      commitContributionsByRepository(maxRepositories: 100) {
        repository {
          name
          isPrivate
        }
        contributions {
          totalCount
        }
      }
      pullRequestContributionsByRepository(maxRepositories: 100) {
        repository {
          isPrivate
        }
        contributions {
          totalCount
        }
      }
      issueContributionsByRepository(maxRepositories: 100) {
        repository {
          isPrivate
        }
        contributions {
          totalCount
        }
      }
      contributionCalendar {
        totalContributions
        weeks {
          contributionDays {
            date
            contributionCount
          }
        }
      }
      totalCommitContributions
      totalPullRequestContributions
      totalIssueContributions
      totalRepositoryContributions
    }
  }
}
