<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Every class, every mood</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=VT323&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#f2b632}a:hover{color:#ffd36b}
.sp{display:block;background-repeat:no-repeat;image-rendering:pixelated;image-rendering:crisp-edges;width:96px;height:128px;background-size:5760px 128px;animation:spA 6.2832s steps(60) infinite}
.sp2{width:192px;height:256px;background-size:11520px 256px;animation-name:spB}
.sp3{width:288px;height:384px;background-size:17280px 384px;animation-name:spC}
@keyframes spA{from{background-position:0 0}to{background-position:-5760px 0}}
@keyframes spB{from{background-position:0 0}to{background-position:-11520px 0}}
@keyframes spC{from{background-position:0 0}to{background-position:-17280px 0}}
.k-paladin{background-image:url(/_blob/f18954a9ff14bedd31f6b8cf06347f8c)}
.k-barbarian{background-image:url(/_blob/8ed10d55447cb8ff45dc57775d210f1c)}
.k-wizard{background-image:url(/_blob/0e4e4ce85931c11f4649005e17d91700)}
.k-artificer{background-image:url(/_blob/773d1670aaa0c025f37789495b0da93e)}
.k-cleric{background-image:url(/_blob/5da7644303d94b752cc1294a2e7d7239)}
.k-bard{background-image:url(/_blob/81732435a286f84828afe49650b3172a)}
.k-monk{background-image:url(/_blob/abcc55103df7689ae00353055ee21137)}
.k-rogue{background-image:url(/_blob/aa0ac593a6177f4dffac476b3b642082)}
.k-monk-happy{background-image:url(/_blob/0a47e55b2effbac564afdcfec0380645)}
.k-monk-weak{background-image:url(/_blob/bf494fffb444ff2fdb3c6f1e4309dbb1)}
.k-monk-hungry{background-image:url(/_blob/72913c88536ed130612b3caeff535a32)}
.k-monk-hungry-nb{background-image:url(/_blob/0cb331181bc6f97b494596f229c9b4b9)}
.k-monk-sleeping{background-image:url(/_blob/4f5904c1250d204389fb4aee96e15406)}
.k-monk-levelup{background-image:url(/_blob/f95aab396a36f6091d54695d7a542712)}
.k-monk-fainted{background-image:url(/_blob/c4ebdb61302b2dfe66f315107abe73c9)}
.ht{width:24px;height:22px;background-image:url(/_blob/1206abce59a5df5a2649f07831cf377c);background-size:312px 22px;background-position:-288px 0;image-rendering:pixelated;image-rendering:crisp-edges}
.ht.on{animation:htA 1.2s steps(12) infinite}
@keyframes htA{from{background-position:0 0}to{background-position:-288px 0}}
.ic{width:24px;height:24px;background-image:url(/_blob/71aa271d046ce726befce13fb5e983d5);background-size:120px 48px;image-rendering:pixelated;image-rendering:crisp-edges}
.pt{width:40px;height:48px;background-image:url(/_blob/43b2b41e579af60d6cfe8444acca4e9d);background-size:320px 48px;image-rendering:pixelated;image-rendering:crisp-edges}
.fire{width:32px;height:48px;background-image:url(/_blob/93bf0f74cfc4f7f9ffa52199390fa6b5);background-size:256px 48px;image-rendering:pixelated;animation:fireA .8s steps(8) infinite}
@keyframes fireA{from{background-position:0 0}to{background-position:-256px 0}}
.tw{position:absolute;width:3px;height:3px;background:#f4ecd8;animation:twA 3s ease-in-out infinite}
@keyframes twA{0%,100%{opacity:.2}50%{opacity:1}}
.flick{animation:flA 1.4s ease-in-out infinite}
@keyframes flA{0%,100%{opacity:.75}30%{opacity:1}60%{opacity:.6}80%{opacity:.95}}
.sc-vphone{background-image:url(/_blob/2a0d8b13b7905af2e8f19fbf97afd361);background-repeat:no-repeat;image-rendering:pixelated;image-rendering:crisp-edges}
.sc-vdesk{background-image:url(/_blob/1bd60d6caa530c58256c87681878c65c);background-repeat:no-repeat;image-rendering:pixelated;image-rendering:crisp-edges}
.sc-camp{background-image:url(/_blob/c0ce4c6770d25dae187af4dbdc4efa31);background-repeat:no-repeat;image-rendering:pixelated;image-rendering:crisp-edges}
.sc-vill{background-image:url(/_blob/8dbcf996e2a37eb61f18340777ab2823);background-repeat:no-repeat;image-rendering:pixelated;image-rendering:crisp-edges}
.sc-keep{background-image:url(/_blob/e7560be3a31ab446d8064639b843fc1f);background-repeat:no-repeat;image-rendering:pixelated;image-rendering:crisp-edges}
.sc-cita{background-image:url(/_blob/2490dc0af2fa3ef6b7f3bf900908adc7);background-repeat:no-repeat;image-rendering:pixelated;image-rendering:crisp-edges}
.sc-title{background-image:url(/_blob/de49c3db297bb01a8f27ff941c55b3ec);background-repeat:no-repeat;image-rendering:pixelated;image-rendering:crisp-edges}
@media (prefers-reduced-motion:reduce){.sp,.ht.on,.tw,.fire,.flick{animation:none}}
.spx{display:block;background-repeat:no-repeat;image-rendering:pixelated;image-rendering:crisp-edges;width:96px;height:128px;background-size:5760px 768px;animation:spAx 6.2832s steps(60) infinite}
@keyframes spAx{from{background-position-x:0}to{background-position-x:-5760px}}
.r0{background-position-y:-0px}
.r1{background-position-y:-128px}
.r2{background-position-y:-256px}
.r3{background-position-y:-384px}
.r4{background-position-y:-512px}
.r5{background-position-y:-640px}
.a-paladin{background-image:url(/_blob/9e8355267bae49b1ca7aa47f4050005d)}
.a-barbarian{background-image:url(/_blob/66fd421e2ceaf32d8e0ccbfd06819a8b)}
.a-wizard{background-image:url(/_blob/0a0051247171bbc073893e7a1da86266)}
.a-artificer{background-image:url(/_blob/765fe7cabacffa226f3a74b388e2c387)}
.a-cleric{background-image:url(/_blob/4b8af6fc5019fe5ba08b6bdf956371c6)}
.a-bard{background-image:url(/_blob/9b74601d90813c7098f5c215b2147e58)}
.a-rogue{background-image:url(/_blob/4083877abe280ce4b83268537bb5958a)}
@media (prefers-reduced-motion:reduce){.spx{animation:none}}
</style>
</helmet>
<div style="width: 1440px; height: 1560px; box-sizing: border-box; padding: 40px 48px; background: #0f0d18; font-family: 'VT323', monospace; color: #f4ecd8; display: flex; flex-direction: column; gap: 18px">
  <div style="display: flex; justify-content: space-between; align-items: baseline">
    <h1 style="margin: 0; font-family: 'Press Start 2P', monospace; font-size: 18px; color: #f2b632; text-shadow: 4px 4px 0 #0a0910">EVERY CLASS, EVERY MOOD</h1>
    <span style="font-size: 22px; color: #a69dbd">8 classes × 7 moods, all animated loops. Same rules, same engine.</span>
  </div>
  <div style="display: grid; grid-template-columns: 120px repeat(7, minmax(0, 1fr)); gap: 10px; align-items: end">
    <span></span>
    <sc-for list="{{head}}" as="h"><span style="font-family: 'Press Start 2P', monospace; font-size: 9px; color: {{h.ink}}; text-align: center">{{h.label}}</span></sc-for>
  </div>
  <div style="display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
      <div style="display: grid; grid-template-columns: 120px repeat(7, minmax(0, 1fr)); gap: 10px; align-items: stretch">
        <div style="display: flex; flex-direction: column; justify-content: center; gap: 8px; background: #1b1829; box-shadow: 0 0 0 3px #0a0910; padding: 8px 10px">
          <span class="pt" aria-hidden="true" style="background-position: {{r.pos}}"></span>
          <span style="font-family: 'Press Start 2P', monospace; font-size: 8px; color: {{r.accent}}">{{r.name}}</span>
        </div>
        <sc-for list="{{r.cells}}" as="c">
          <div style="position: relative; height: 156px; overflow: hidden; background: linear-gradient(#2a2540, #2a2540 76%, #1a1727 76%); box-shadow: 0 0 0 3px #0a0910">
            <sc-if value="{{c.rays}}" hint-placeholder-val="{{ false }}">
              <div aria-hidden="true" style="position: absolute; left: 50%; top: -10px; width: 190px; height: 190px; margin-left: -95px; background: repeating-conic-gradient(rgba(242, 182, 50, 0.32) 0 9deg, transparent 9deg 18deg); -webkit-mask-image: radial-gradient(circle, #000 22%, transparent 66%); mask-image: radial-gradient(circle, #000 22%, transparent 66%)"></div>
            </sc-if>
            <sc-if value="{{c.standing}}" hint-placeholder-val="{{ true }}">
              <div class="{{c.cls}}" role="img" aria-label="{{c.alt}}" style="position: absolute; left: 50%; margin-left: -48px; bottom: 14px"></div>
            </sc-if>
            <sc-if value="{{c.lying}}" hint-placeholder-val="{{ false }}">
              <div aria-hidden="true" style="position: absolute; left: 50%; margin-left: -58px; bottom: 16px; width: 116px; height: 8px; background: radial-gradient(ellipse, rgba(5, 4, 10, 0.7) 0 50%, transparent 72%)"></div>
              <div role="img" aria-label="{{c.alt}}" style="position: absolute; left: 50%; margin-left: -64px; bottom: 18px; width: 128px; height: 96px">
                <div class="{{c.cls}}" style="position: absolute; left: 16px; top: -16px; transform: rotate(90deg)"></div>
              </div>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1560}}'>
var ORDER = ['PALADIN','BARBARIAN','WIZARD','ARTIFICER','CLERIC','BARD','MONK','ROGUE'];
var ACCENT = { PALADIN: '#6c9cf0', BARBARIAN: '#ef7a52', WIZARD: '#a98cf0', ARTIFICER: '#e3a15a', CLERIC: '#4fcfc1', BARD: '#ef7099', MONK: '#f5c04a', ROGUE: '#9fc39f' };
var HABIT = {
  PALADIN: 'Keeps an oath of daily commits: consistent, unbroken streaks', BARBARIAN: 'Charges in with huge pull requests and bursts of activity',
  WIZARD: 'Masters many languages across their projects', ARTIFICER: 'Builds the machinery: Docker, CI, infrastructure as code',
  CLERIC: 'Heals codebases: reports issues and lands fixes', BARD: 'Works through pull requests, documents well and draws an audience',
  MONK: 'Disciplined: small pull requests and descriptive commit messages', ROGUE: 'Strikes from the shadows, doing much of their work on weekends'
};
var SIGNALS = { PALADIN: 'streaks, active days', BARBARIAN: 'PR size, bursts', WIZARD: 'languages used', ARTIFICER: 'infra files in repos', CLERIC: 'issues, fix commits', BARD: 'PRs, stars, READMEs', MONK: 'small PRs, message quality', ROGUE: 'weekend share' };
var SCORES = { MONK: 52, ROGUE: 47, PALADIN: 44, BARBARIAN: 44, WIZARD: 33, ARTIFICER: 33, BARD: 10, CLERIC: 0 };
function kcls(n) { return 'k-' + n.toLowerCase(); }
function ptPos(n) { return '-' + (ORDER.indexOf(n) * 40) + 'px 0'; }
function stageBg(n) { return 'radial-gradient(ellipse 55% 45% at 50% 68%, ' + ACCENT[n] + '3a, transparent 70%), linear-gradient(#2a2540, #2a2540 76%, #1a1727 76%)'; }
function sortedByScore() { return ORDER.slice().sort(function (a, b) { return (SCORES[b] - SCORES[a]) || (ORDER.indexOf(a) - ORDER.indexOf(b)); }); }
function hearts(n) { var a = []; for (var i = 0; i < 3; i++) a.push({ cls: i < n ? 'ht on' : 'ht', delay: '-' + (i * 0.3).toFixed(1) + 's' }); return a; }
function tabsFor(active) {
  var L = ['HOME', 'JOURNAL', 'HERO', 'ARENA', 'SETTINGS'];
  return L.map(function (l, i) { var on = i === active; return { label: l, color: on ? '#f2b632' : '#a69dbd', bg: on ? '#2e2945' : 'transparent', line: on ? '#f2b632' : 'transparent', pos: '-' + (i * 24) + 'px ' + (on ? '-24px' : '0') }; });
}
function xpSegs(n, filled) { var o = []; for (var i = 0; i < n; i++) o.push({ fill: i < filled ? 'linear-gradient(#ffe48f,#f2b632 52%,#b87a1c)' : '#2e2945' }); return o; }
var MOODS = [['OKAY', '#f4ecd8'], ['HAPPY', '#f5c04a'], ['WEAK', '#efa07a'], ['HUNGRY', '#efa07a'], ['SLEEPING', '#c9c0dc'], ['LEVEL UP', '#f2b632'], ['FAINTED', '#efa07a']];
var MONK_SUFFIX = ['', '-happy', '-weak', '-hungry-nb', '-sleeping', '-levelup', '-fainted'];
function cell(n, i) {
  var l = n.toLowerCase(), cls;
  if (i === 0) cls = 'sp k-' + l;
  else if (n === 'MONK') cls = 'sp k-monk' + MONK_SUFFIX[i];
  else cls = 'spx a-' + l + ' r' + (i - 1);
  return { cls: cls, rays: i === 5, lying: i === 6, standing: i !== 6, alt: n.toLowerCase() + ' ' + MOODS[i][0].toLowerCase().replace(' ', '-') + ', animated' };
}
class Component extends DCLogic {
  renderVals() {
    return {
      head: MOODS.map(function (m) { return { label: m[0], ink: m[1] }; }),
      rows: ORDER.map(function (n) { var cells = []; for (var i = 0; i < 7; i++) cells.push(cell(n, i)); return { name: n, accent: ACCENT[n], pos: ptPos(n), cells: cells }; })
    };
  }
}
</script>
</body>
</html>
