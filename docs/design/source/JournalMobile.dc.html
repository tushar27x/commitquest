<head>

.k-paladin{background-image:url(/_blob/f18954a9ff14bedd31f6b8cf06347f8c)}

.k-bard{background-image:url(/_blob/81732435a286f84828afe49650b3172a)}
.k-monk{background-image:url(/_blob/abcc55103df7689ae00353055ee21137)}
.k-rogue{background-image:url(/_blob/aa0ac593a6177f4dffac476b3b642082)}

.k-monk-hungry-nb{background-image:url(/_blob/0cb331181bc6f97b494596f229c9b4b9)}
.k-monk-sleeping{background-image:url(/_blob/4f5904c1250d204389fb4aee96e15406)}
.k-monk-levelup{background-image:url(/_blob/f95aab396a36f6091d54695d7a542712)}
.k-monk-fainted{background-image:url(/_blob/c4ebdb61302b2dfe66f315107abe73c9)}
.ht{width:24px;height:22px;background-image:url(/_blob/1206abce59a5df5a2649f07831cf377c);background-size:312px 22px;background-position:-288px 0;image-rendering:pixelated;image-rendering:crisp-edges}
.ht.on{animation:htA 1.2s steps(12) infinite}
@keyframes htA{from{background-position:0 0}to{background-position:-288px 0}}
.ic{width:24px;height:24px;background-image:url(/_blob/71aa271d046ce726befce13fb5e983d5);background-size:120px 48px;image-rendering:pixelated;image-rendering:crisp-edges}
.pt{width:40px;height:48px;background-image:url(/_blob/43b2b41e579af60d6cfe8444acca4e9d);background-size:320px 48px;image-rendering:pixelated;image-rendering:crisp-edges}

@keyframes fireA{from{background-position:0 0}to{background-position:-256px 0}}
.tw{position:absolute;width:3px;height:3px;background:#f4ecd8;animation:twA 3s ease-in-out infinite}

.flick{animation:flA 1.4s ease-in-out infinite}

.sc-vphone{background-image:url(/_blob/2a0d8b13b7905af2e8f19fbf97afd361);background-repeat:no-repeat;image-rendering:pixelated;image-rendering:crisp-edges}
.sc-vdesk{background-image:url(/_blob/1bd60d6caa530c58256c87681878c65c);background-repeat:no-repeat;image-rendering:pixelated;image-rendering:crisp-edges}
.sc-camp{background-image:url(/_blob/c0ce4c6770d25dae187af4dbdc4efa31);background-repeat:no-repeat;image-rendering:pixelated;image-rendering:crisp-edges}
.sc-vill{background-image:url(/_blob/8dbcf996e2a37eb61f18340777ab2823);background-repeat:no-repeat;image-rendering:pixelated;image-rendering:crisp-edges}
.sc-keep{background-image:url(/_blob/e7560be3a31ab446d8064639b843fc1f);background-repeat:no-repeat;image-rendering:pixelated;image-rendering:crisp-edges}
.sc-cita{background-image:url(/_blob/2490dc0af2fa3ef6b7f3bf900908adc7);background-repeat:no-repeat;image-rendering:pixelated;image-rendering:crisp-edges}
.sc-title{background-image:url(/_blob/de49c3db297bb01a8f27ff941c55b3ec);background-repeat:no-repeat;image-rendering:pixelated;image-rendering:crisp-edges}
@media (prefers-reduced-motion:reduce){.sp,.ht.on,.tw,.fire,.flick{animation:none}}

</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #13111c; font-family: 'VT323', monospace; color: #f4ecd8; overflow: hidden">
  <header style="flex-shrink: 0; position: relative; z-index: 2; padding: 14px 16px 12px; background: #221e33; box-shadow: 0 4px 0 #0a0910; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
      <div style="display: flex; align-items: center; gap: 12px">
        <span class="pt" aria-hidden="true" style="background-position: -240px 0"></span>
        <h1 style="margin: 0; font-family: 'Press Start 2P', monospace; font-size: 14px; color: #f2b632">JOURNAL</h1>
      </div>
      <span style="font-size: 18px; color: #a69dbd">Your last 12 months</span>
    </div>
    <div role="tablist" aria-label="Journal sections" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
      <button type="button" role="tab" aria-selected="true" style="height: 36px; border: 0; font-family: 'Press Start 2P', monospace; font-size: 8px; color: #1a1410; background: linear-gradient(#ffe48f, #f2b632 55%, #c98a1e); box-shadow: 0 0 0 2px #0a0910; cursor: pointer">STATS</button>
      <button type="button" role="tab" aria-selected="false" style="height: 36px; border: 0; font-family: 'Press Start 2P', monospace; font-size: 8px; color: #c9c0dc; background: #2e2945; box-shadow: 0 0 0 2px #0a0910; cursor: pointer">REPOS</button>
      <button type="button" role="tab" aria-selected="false" style="height: 36px; border: 0; font-family: 'Press Start 2P', monospace; font-size: 8px; color: #c9c0dc; background: #2e2945; box-shadow: 0 0 0 2px #0a0910; cursor: pointer">REVIEWS</button>
    </div>
  </header>
  <main style="flex: 1; overflow: hidden; padding: 16px 12px 10px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <sc-for list="{{stats}}" as="s" hint-placeholder-count="4">
        <div style="background: #221e33; box-shadow: 0 0 0 3px #0a0910, inset 2px 2px 0 rgba(255,255,255,.06), inset -2px -2px 0 rgba(0,0,0,.28); padding: 12px 12px 10px; display: flex; flex-direction: column; gap: 6px">
          <span style="font-family: 'Press Start 2P', monospace; font-size: 7px; color: #a69dbd">{{s.label}}</span>
          <span style="font-family: 'Press Start 2P', monospace; font-size: 18px; color: {{s.ink}}">{{s.value}}</span>
        </div>
      </sc-for>
    </div>
    <section style="background: #221e33; box-shadow: 0 0 0 3px #0a0910, inset 2px 2px 0 rgba(255,255,255,.06), inset -2px -2px 0 rgba(0,0,0,.28); padding: 12px 12px 14px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <h2 style="margin: 0; font-family: 'Press Start 2P', monospace; font-size: 8px">LAST 28 DAYS</h2>
        <span style="font-size: 18px; color: #a69dbd">18 active</span>
      </div>
      <div role="img" aria-label="Contribution calendar for the last 28 days, 18 active days" style="display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 4px">
        <sc-for list="{{cal}}" as="c"><span style="aspect-ratio: 1; background: {{c.fill}}; box-shadow: 0 0 0 1px #0a0910, inset 1px 1px 0 rgba(255, 255, 255, 0.18)"></span></sc-for>
      </div>
    </section>
    <section style="background: #221e33; box-shadow: 0 0 0 3px #0a0910, inset 2px 2px 0 rgba(255,255,255,.06), inset -2px -2px 0 rgba(0,0,0,.28); padding: 12px 12px 14px; display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-family: 'Press Start 2P', monospace; font-size: 8px">TOP REPOS</h2>
      <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
        <sc-for list="{{repos}}" as="r" hint-placeholder-count="3">
          <li style="display: grid; grid-template-columns: 120px minmax(0, 1fr) 30px; align-items: center; gap: 10px">
            <span style="font-size: 19px; line-height: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.name}}</span>
            <span style="height: 10px; background: #2e2945; display: block"><span style="display: block; height: 10px; width: {{r.pct}}%; background: linear-gradient(#ffe48f, #f2b632 55%, #c98a1e)"></span></span>
            <span style="font-size: 19px; text-align: right; color: #c9c0dc">{{r.count}}</span>
          </li>
        </sc-for>
      </ol>
    </section>
    <section style="background: #efe0bb; color: #2a1d12; padding: 12px 14px; box-shadow: 0 0 0 3px #0a0910, inset 0 0 0 3px #c9b48a; display: flex; flex-direction: column; gap: 6px">
      <h2 style="margin: 0; font-family: 'Press Start 2P', monospace; font-size: 8px; color: #6b3d16">YEAR IN REVIEW</h2>
      <p style="margin: 0; font-size: 20px; line-height: 1.05">[AI year in review, first two lines, then fades into READ MORE.]</p>
      <a href="#" style="align-self: flex-end; font-family: 'Press Start 2P', monospace; font-size: 7px; color: #6b3d16; text-decoration: none; padding: 6px 0">READ MORE ▶</a>
    </section>
  </main>
  <nav aria-label="Main" style="height: 64px; flex-shrink: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #221e33; box-shadow: 0 -4px 0 #0a0910">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
      <a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-decoration: none; color: {{t.color}}; background: {{t.bg}}; box-shadow: inset 0 3px 0 {{t.line}}; font-family: 'Press Start 2P', monospace; font-size: 7px">
        <span class="ic" aria-hidden="true" style="background-position: {{t.pos}}"></span>
        {{t.label}}
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var ORDER = ['PALADIN','BARBARIAN','WIZARD','ARTIFICER','CLERIC','BARD','MONK','ROGUE'];
var ACCENT = { PALADIN: '#6c9cf0', BARBARIAN: '#ef7a52', WIZARD: '#a98cf0', ARTIFICER: '#e3a15a', CLERIC: '#4fcfc1', BARD: '#ef7099', MONK: '#f5c04a', ROGUE: '#9fc39f' };
var HABIT = {
  PALADIN: 'Keeps an oath of daily commits: consistent, unbroken streaks', BARBARIAN: 'Charges in with huge pull requests and bursts of activity',
  WIZARD: 'Masters many languages across their projects', ARTIFICER: 'Builds the machinery: Docker, CI, infrastructure as code',
  CLERIC: 'Heals codebases: reports issues and lands fixes', BARD: 'Works through pull requests, documents well and draws an audience',
  MONK: 'Disciplined: small pull requests and descriptive commit messages', ROGUE: 'Strikes from the shadows, doing much of their work on weekends'
};
var SIGNALS = { PALADIN: 'streaks, active days', BARBARIAN: 'PR size, bursts', WIZARD: 'languages used', ARTIFICER: 'infra files in repos', CLERIC: 'issues, fix commits', BARD: 'PRs, stars, READMEs', MONK: 'small PRs, message quality', ROGUE: 'weekend share' };
var SCORES = { MONK: 52, ROGUE: 47, PALADIN: 44, BARBARIAN: 44, WIZARD: 33, ARTIFICER: 33, BARD: 10, CLERIC: 0 };
function kcls(n) { return 'k-' + n.toLowerCase(); }
function ptPos(n) { return '-' + (ORDER.indexOf(n) * 40) + 'px 0'; }
function stageBg(n) { return 'radial-gradient(ellipse 55% 45% at 50% 68%, ' + ACCENT[n] + '3a, transparent 70%), linear-gradient(#2a2540, #2a2540 76%, #1a1727 76%)'; }
function sortedByScore() { return ORDER.slice().sort(function (a, b) { return (SCORES[b] - SCORES[a]) || (ORDER.indexOf(a) - ORDER.indexOf(b)); }); }
function hearts(n) { var a = []; for (var i = 0; i < 3; i++) a.push({ cls: i < n ? 'ht on' : 'ht', delay: '-' + (i * 0.3).toFixed(1) + 's' }); return a; }
function tabsFor(active) {
  var L = ['HOME', 'JOURNAL', 'HERO', 'ARENA', 'SETTINGS'];
  return L.map(function (l, i) { var on = i === active; return { label: l, color: on ? '#f2b632' : '#a69dbd', bg: on ? '#2e2945' : 'transparent', line: on ? '#f2b632' : 'transparent', pos: '-' + (i * 24) + 'px ' + (on ? '-24px' : '0') }; });
}
function xpSegs(n, filled) { var o = []; for (var i = 0; i < n; i++) o.push({ fill: i < filled ? 'linear-gradient(#ffe48f,#f2b632 52%,#b87a1c)' : '#2e2945' }); return o; }
var COUNTS = [2,5,0,3,1,0,0,4,6,2,0,1,3,0,0,2,7,3,1,0,0,5,2,3,4,0,1,0];
var SHADES = ['#2e2945', '#7a5a22', '#b8862a', '#f2b632'];
class Component extends DCLogic {
  renderVals() {
    return {
      stats: [
        { label: 'COMMITS', value: '412', ink: '#f2b632' }, { label: 'PULL REQUESTS', value: '37', ink: '#f4ecd8' },
        { label: 'ISSUES', value: '9', ink: '#f4ecd8' }, { label: 'STARS', value: '18', ink: '#f4ecd8' }
      ],
      cal: COUNTS.map(function (n) { return { fill: SHADES[n === 0 ? 0 : n < 3 ? 1 : n < 5 ? 2 : 3] }; }),
      repos: [{ name: 'insightsHubV2', count: 96, pct: 100 }, { name: 'insight_hub', count: 71, pct: 74 }, { name: 'socratese', count: 34, pct: 35 }],
      tabs: tabsFor(1)
    };
  }
}
</script>
</body>
</html>
